name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "tf/**"

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.7.0"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::882088608073:role/github-actions-terraform
          aws-region: ap-south-1

      - name: Terraform Init
        working-directory: tf
        run: |
          terraform init \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="bucket=zorin-terraform-state" \
            -backend-config="region=ap-southeast-2" \
            -backend-config="dynamodb_table=zorin-terraform-locks"

      - name: Terraform Fmt
        working-directory: tf
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: tf
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: tf
        run:  |
          terraform plan -input=false -var-file=environments/dev/terraform.tfvars -out=tfplan
          terraform show tfplan > plan-output.txt
          echo "plan_output=$(base64 plan-output.txt)" >> $GITHUB_OUTPUT

      - name: Comment PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const plan = `${process.env.TF_PLAN_OUTPUT}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan (dev)\n\`\`\`\n${plan}\n\`\`\``
            });
        env:
          TF_PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}