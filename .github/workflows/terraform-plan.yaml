name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/**"
      - "*.tf"
      - "*.tfvars"

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::ACCOUNT_ID:role/github-actions-terraform
          aws-region: ap-south-1

      - name: Terraform Init
        working-directory: environments/dev
        run: |
          terraform init \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="bucket=zorin-terraform-state" \
            -backend-config="region=ap-south-1" \
            -backend-config="dynamodb_table=zorin-terraform-locks"

      - name: Terraform Fmt
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: environments/dev
        run: terraform validate

      - name: Terraform Plan
        working-directory: environments/dev
        run: terraform plan -out=tfplan -input=false
        continue-on-error: true

      - name: Comment PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const plan = `${process.env.TF_PLAN_OUTPUT}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan (dev)\n\`\`\`\n${plan}\n\`\`\``
            });
        env:
          TF_PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}   