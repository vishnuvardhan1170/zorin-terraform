name: Terraform Plan

on:
  push:
    branches: [main]
    paths:
      - "tf/**"

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/927186636170/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "927186636170-compute@developer.gserviceaccount.com"

      - name: Terraform Init
        working-directory: tf
        run: |
          terraform init \
            -backend-config="bucket=zorin-terraform-state" \
            -backend-config="prefix=prod"

      - name: Terraform Fmt
        working-directory: tf
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: tf
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: tf
        run: |
          terraform plan -input=false -var-file=environments/prod/terraform.tfvars -out=tfplan
          terraform show tfplan > plan-output.txt
          echo "plan_output=$(base64 plan-output.txt)" >> $GITHUB_OUTPUT

      - name: Comment PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const plan = Buffer.from(process.env.TF_PLAN_OUTPUT, 'base64').toString('utf-8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan\n\`\`\`\n${plan}\n\`\`\``
            });
        env:
          TF_PLAN_OUTPUT: ${{ steps.plan.outputs.plan_output }}   