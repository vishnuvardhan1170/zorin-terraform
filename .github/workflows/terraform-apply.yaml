name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "tf/**"

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/123456789012/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "tf-bot@your-gcp-project.iam.gserviceaccount.com"

      - name: Terraform Init
        working-directory: tf
        run: |
          terraform init \
            -backend-config="bucket=zorin-terraform-state" \
            -backend-config="prefix=prod"

      - name: Terraform Validate
        working-directory: tf
        run: terraform validate

      - name: Terraform Apply
        working-directory: tf
        run: terraform apply -auto-approve -input=false -var-file=environments/prod/terraform.tfvars   