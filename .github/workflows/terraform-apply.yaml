name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "tf/**"

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.7.0"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::882088608073:role/github-actions-terraform
          aws-region: ap-south-1

      - name: Terraform Init
        working-directory: tf
        run: |
          terraform init \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="bucket=zorin-terraform-state" \
            -backend-config="region=ap-southeast-2" \
            -backend-config="dynamodb_table=zorin-terraform-locks"

      - name: Terraform Apply
        working-directory: tf
        run: terraform apply -auto-approve -input=false -var-file=environments/prod/terraform.tfvars