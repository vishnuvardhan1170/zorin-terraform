name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/**"
      - "*.tf"
      - "*.tfvars"

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: prod   # ← manual gate (Option B from earlier)
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::ACCOUNT_ID:role/github-actions-terraform
          aws-region: ap-south-1

      - name: Terraform Init
        working-directory: environments/prod
        run: |
          terraform init \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="bucket=zorin-terraform-state" \
            -backend-config="region=ap-south-1" \
            -backend-config="dynamodb_table=zorin-terraform-locks"

      - name: Terraform Apply
        working-directory: environments/prod
        run: terraform apply -auto-approve -input=false   