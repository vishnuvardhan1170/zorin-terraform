name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "tf/**"

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.7.0"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "tf-bot@PROJECT_ID.iam.gserviceaccount.com"

      - name: Terraform Init
        working-directory: tf
        run: |
          terraform init \
            -backend-config="bucket=zorin-terraform-state" \
            -backend-config="prefix=prod"

      - name: Terraform Apply
        working-directory: tf
        run: terraform apply -auto-approve -input=false -var-file=environments/prod/terraform.tfvars   